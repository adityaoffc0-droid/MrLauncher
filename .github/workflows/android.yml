name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6  
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MrLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.3
          name: mesa-aar
          path: app_mrlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build LTW
        run: |
          cd ltw_src
          chmod +x gradlew
          ./gradlew :ltw:assembleRelease
          mkdir -p ../app_mrlauncher/libs
          cp ltw/build/outputs/aar/ltw-release.aar ../app_mrlauncher/libs/ltw.aar

      - name: Create out directory
        run: mkdir out
      - name: Build Publishing .aab
        if: github.repository_owner == 'MrLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_mrlauncher:bundleFullGplay
          mv app_mrlauncher/build/outputs/bundle/fullGplay/app_mrlauncher-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_mrlauncher:assembleFullDebug
          mv app_mrlauncher/build/outputs/apk/full/debug/app_mrlauncher-full-debug.apk out/app-debug-full.apk

      - name: Build Nightly Release .apk
        if: github.repository_owner == 'MrLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_mrlauncher:assembleFullPubRelease
          mv app_mrlauncher/build/outputs/apk/full/pubRelease/app_mrlauncher-full-pubRelease.apk out/MrLauncher-release.apk
      - name: Gen md5sums
        run: |
          md5sum out/app-debug-full.apk > out/app-debug-full.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug-full.apk

      - name: Release Nightly APK
        if: github.repository_owner == 'MrLauncher' && github.ref_name == 'v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: MrLauncher Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            MrLauncher nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/MrLauncher-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'MrLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: com.mrlauncher.app
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
