name: Build MrLauncher (no runtime)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build debug APK (noruntime)
        run: gradle :app_mrlauncher:assembleNoruntimeDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MrLauncher-noruntime-debug
          path: app_mrlauncher/build/outputs/apk/noruntime/debug/*.apk
